spring:
  datasource:
    url: jdbc:h2:mem:rentacar;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/dev-data

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8080

app:
  jwt:
    secret: local-development-secret-key-256-bits-long-for-hmac-sha256-algorithm
    expiration: 15m
    refresh-cookie-secure: false # plain http on localhost

# Enable CORS for local development
cors:
  allowed-origins: http://localhost:3000,http://localhost:8080
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: "*"
  allow-credentials: true
