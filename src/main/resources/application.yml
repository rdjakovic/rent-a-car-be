spring:
  application:
    name: rent-a-car
  profiles:
    active: local
    group:
      # 'docker' = dev settings + PostgreSQL from compose.yaml
      docker: dev
  docker:
    compose:
      # Only the 'docker' profile starts containers (see application-docker.yml)
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    # Jackson 3 auto-detects @AllArgsConstructor and nulls missing fields; keep default-ctor + setter binding (Jackson 2 behavior)
    visibility:
      creator: none
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.nextstep.rentacar: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

app:
  jwt:
    # No default: profiles without their own secret must set JWT_SECRET (validated at startup)
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:15m} # access token
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:12h} # sign-in session (refresh cookie)
  admin:
    # Optional: sets the seeded admin user's password at startup (see AdminPasswordInitializer)
    password: ${ADMIN_PASSWORD:}

# Browser origins allowed to call the API directly (comma-separated, exact). None by default:
# serve the UI and the API behind one host (the UI's dev server proxies /api)
cors:
  allowed-origins: ${CORS_ORIGINS:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
